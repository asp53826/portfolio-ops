name: Claim Auditor

# Runs commands declared by the calling repository, so it must only ever see
# trusted code. Callers must invoke this on schedule, workflow_dispatch, or
# push to a protected branch — never on pull_request or pull_request_target,
# where a fork could rewrite claims.toml into an arbitrary command.

on:
  workflow_call:
    inputs:
      runtime:
        description: python, node or none
        required: false
        default: python
        type: string
      runtime-version:
        required: false
        default: "3.12"
        type: string
      install-command:
        required: false
        default: ""
        type: string
      manifest:
        description: path to the claim manifest, relative to the repository root
        required: false
        default: claims.toml
        type: string
      claim-timeout:
        description: seconds allowed for a single claim command
        required: false
        default: 900
        type: number
      timeout-minutes:
        required: false
        default: 45
        type: number

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out portfolio control scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: asp53826/portfolio-ops
          ref: v1.3.0
          path: .portfolio-ops
          persist-credentials: false
      - name: Set up Python
        if: inputs.runtime == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.runtime-version }}
      - name: Set up Node.js
        if: inputs.runtime == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.runtime-version }}
      - name: Set up Python for the auditor
        if: inputs.runtime != 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project
        if: inputs.install-command != ''
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -eo pipefail -c "$INSTALL_COMMAND"
      - name: Re-run every declared claim
        id: audit
        continue-on-error: true
        env:
          MANIFEST: ${{ inputs.manifest }}
          CLAIM_TIMEOUT: ${{ inputs.claim-timeout }}
        run: >-
          python3 .portfolio-ops/scripts/claim_auditor.py
          --root .
          --manifest "$MANIFEST"
          --timeout "$CLAIM_TIMEOUT"
          --report .portfolio-evidence/claim-audit.json
      - name: Summarise the audit
        if: always()
        run: >-
          python3 .portfolio-ops/scripts/claim_summary.py
          --report .portfolio-evidence/claim-audit.json
          >> "$GITHUB_STEP_SUMMARY"
      - name: Record verification evidence
        if: always()
        run: >-
          python3 .portfolio-ops/scripts/evidence_manifest.py
          --kind claim-auditor
          --command "claim_auditor.py --manifest ${{ inputs.manifest }}"
          --result "${{ steps.audit.outcome }}"
          --output .portfolio-evidence/claim-auditor-run.json
      - name: Open or update the claim drift issue
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[bot] Published claim no longer reproduces"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .portfolio-ops/scripts/claim_summary.py \
            --report .portfolio-evidence/claim-audit.json \
            --failures-only --run-url "$RUN_URL" > body.md
          issue=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md --label automation
          fi
      - name: Close recovered claim issue
        if: steps.audit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[bot] Published claim no longer reproduces"
        run: |
          issue=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Claim Auditor reproduced every declared claim in run $GITHUB_RUN_ID."
          fi
      - name: Preserve the audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claim-audit-${{ github.run_id }}
          path: .portfolio-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Fail after recording the issue
        if: steps.audit.outcome == 'failure'
        run: exit 1
