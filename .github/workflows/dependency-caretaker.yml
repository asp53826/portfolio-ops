name: Dependency Caretaker

on:
  workflow_call:

permissions:
  pull-requests: write

jobs:
  patch-update:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata without checking out PR code
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Mark patch updates as eligible after CI
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label "automerge:patch"
      - name: Remove eligibility from retained updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR_URL" --remove-label "automerge:patch" 2>/dev/null || true
          echo "${{ steps.metadata.outputs.update-type }} remains human-reviewed"
