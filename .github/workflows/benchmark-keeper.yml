name: Benchmark Keeper

on:
  workflow_call:
    inputs:
      runtime:
        required: true
        type: string
      runtime-version:
        required: false
        default: "3.12"
        type: string
      install-command:
        required: false
        default: ""
        type: string
      preflight-command:
        required: true
        type: string
      benchmark-command:
        required: true
        type: string
      timeout-minutes:
        required: false
        default: 45
        type: number

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out portfolio control scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: asp53826/portfolio-ops
          ref: v1.0.0
          path: .portfolio-ops
          persist-credentials: false
      - name: Set up Python
        if: inputs.runtime == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.runtime-version }}
      - name: Set up Node.js
        if: inputs.runtime == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.runtime-version }}
      - name: Install project
        if: inputs.install-command != ''
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -eo pipefail -c "$INSTALL_COMMAND"
      - name: Verify benchmark prerequisites
        env:
          PREFLIGHT_COMMAND: ${{ inputs.preflight-command }}
        run: bash -eo pipefail -c "$PREFLIGHT_COMMAND"
      - name: Run benchmark and retain raw output
        env:
          BENCHMARK_COMMAND: ${{ inputs.benchmark-command }}
        run: |
          set -o pipefail
          mkdir -p .portfolio-evidence
          bash -eo pipefail -c "$BENCHMARK_COMMAND" 2>&1 | tee .portfolio-evidence/benchmark.log
      - name: Record benchmark evidence
        if: always()
        run: >-
          python3 .portfolio-ops/scripts/evidence_manifest.py
          --kind benchmark
          --command "${{ inputs.benchmark-command }}"
          --result "${{ job.status }}"
          --output .portfolio-evidence/benchmark.json
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .portfolio-evidence
          if-no-files-found: error
          retention-days: 90
