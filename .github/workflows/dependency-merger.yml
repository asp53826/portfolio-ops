name: Dependency Merger

on:
  workflow_call:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge-after-ci:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the open Dependabot pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eligible=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "automerge:patch")')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
      - name: Wait for the complete pull-request check set
        if: steps.pull-request.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --interval 10
      - name: Merge the verified patch update
        if: steps.pull-request.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
